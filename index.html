<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>foldlab</title>
    <!-- Relative, so it works under /foldlab/ (suite rule 1). No manifest and
         no service worker: only the Arcade is installed (suite rule 6). -->
    <link rel="icon" type="image/png" href="./icon-512.png" />
  </head>
  <body>
    <!-- The house button: back to the Arcade at the site root (suite rule 5). -->
    <a id="home-button" href="/" aria-label="Back to the Arcade">
      <svg viewBox="0 0 48 48" aria-hidden="true">
        <path d="M8 23 L24 9 L40 23" />
        <path d="M13 20 V39 H35 V20" />
        <path d="M21 39 V29 H27 V39" />
      </svg>
    </a>
    <main id="screen">
      <!-- The paper, drawn in 3D. One finger on it folds it; two fingers move the view. -->
      <div id="stage">
        <canvas id="paper" aria-label="Paper"></canvas>
        <!-- Notation, drawn over the paper: the Step's fold lines and arrows. -->
        <svg id="notation" aria-hidden="true"></svg>
      </div>
      <!-- The Model player: which Model and Step, and the Step's text. -->
      <div id="step">
        <p id="step-title"></p>
        <p id="step-text"></p>
      </div>
      <div id="controls">
        <!-- Tilts the view to show the layers, and back. A camera move only. -->
        <button id="tilt" type="button" aria-pressed="false">Tilt</button>
        <!-- Turns the paper over to show its other side, and back. A view move only: not the Fold type "turn over". -->
        <button id="flip" type="button" aria-pressed="false">Flip</button>
        <!-- Takes back the last Fold. -->
        <button id="undo" type="button">Undo</button>
        <!-- Back to the start of this Step, or of the Step before. -->
        <button id="step-back" type="button">Step back</button>
        <!-- Calm help: offered after a few misses; plays the Fold once. -->
        <button id="show-me" type="button" hidden>Show me</button>
        <!-- Shown once the Model is finished: back to its first Step. -->
        <button id="again" type="button" hidden>Fold it again</button>
      </div>
      <p id="stats" hidden></p>
    </main>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
